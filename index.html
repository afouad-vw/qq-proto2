<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuidQuo Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>/* Layout: top bar · hologram construct (top 2/3) · blended command deck (bottom 1/3, scrolls) · full-screen overlays */
:root{
  --void:#040504; --carbon:#0A0B0A; --c850:#101310; --c800:#151714; --c700:#1C1F1A; --c600:#282B26;
  --bone:#F4F6EE; --dim:#C9CCC2; --graph:#8A8A85; --mute:#5E625A;
  --lime:#C6FF34; --acid:#A8E01F; --pale:#E4FFA6;
  --up:#00E5A0; --hold:#FFB020; --down:#FF3B5C; --info:#7FD6FF;
  --glass:rgba(14,17,13,.58); --glass2:rgba(20,24,18,.72); --edge:rgba(228,255,166,.13); --edge2:rgba(198,255,52,.32);
  --f-disp:'Sora',ui-sans-serif,system-ui,sans-serif; --f-body:'Inter',ui-sans-serif,system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px; --r-s:9px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--void);color:var(--bone)}
body{margin:0;font:14px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--graph)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--c600);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- app frame ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{position:absolute;left:0;right:0;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(4,5,4,.85),rgba(4,5,4,0));pointer-events:none}
#top>*{pointer-events:auto}
.logo{height:26px;display:block}
.logo svg{height:100%;width:auto;display:block}
.dock{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.dock button{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:.25s}
.dock button svg{width:20px;height:20px}
.dock button:hover{color:var(--carbon);background:var(--lime);box-shadow:0 0 22px rgba(198,255,52,.45)}
.dock button .tip{position:absolute;top:52px;left:50%;transform:translateX(-50%) translateY(-4px);white-space:nowrap;font:500 11.5px var(--f-body);
  background:var(--glass2);border:1px solid var(--edge);padding:5px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:.2s;color:var(--bone)}
.dock button:hover .tip{opacity:1;transform:translateX(-50%)}
.dock .badge{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--hold);box-shadow:0 0 8px var(--hold)}
.acct{justify-self:end;display:flex;align-items:center;gap:10px}
.vsel{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:relative}
.vsel .vi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c700);font:600 11px var(--f-mono);color:var(--lime);border:1px solid var(--edge2)}
.vsel .vn{font:500 13px var(--f-disp);line-height:1.1}.vsel .vs{font-size:11px;color:var(--graph);line-height:1.2}
.vsel svg{width:14px;height:14px;color:var(--graph)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--acid));color:var(--carbon);font:600 13px var(--f-disp);display:grid;place-items:center;
  box-shadow:0 0 0 3px rgba(198,255,52,.15),0 0 18px rgba(198,255,52,.3)}
.vmenu{position:absolute;top:calc(100% + 8px);right:0;width:300px;padding:8px;border-radius:var(--r);background:var(--glass2);border:1px solid var(--edge);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:40}
.vmenu .lbl{padding:8px 10px 6px}
.vopt{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;width:100%;text-align:left}
.vopt:hover{background:rgba(198,255,52,.07)}
.vopt.on{background:rgba(198,255,52,.1);outline:1px solid var(--edge2)}
.vopt .sc{margin-left:auto;font:500 12px var(--f-mono);color:var(--pale)}

/* ---------- construct ---------- */
#stage{position:relative;flex:0 0 66.666%;min-height:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gl.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.tag{position:absolute;transform:translate(-50%,0);font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--pale);white-space:nowrap;
  padding:2px 7px;border-radius:5px;background:rgba(4,5,4,.55);border:1px solid rgba(198,255,52,.16);transition:opacity .2s}
.tag.aether{font:500 12.5px var(--f-disp);letter-spacing:.02em;color:var(--lime);border-color:var(--edge2)}
.tag i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--graph)}
.tag i.active{background:var(--lime);box-shadow:0 0 8px var(--lime);animation:blink 1.6s infinite}
.tag i.blocked{background:var(--down);box-shadow:0 0 8px var(--down)}
.tag i.waiting{background:var(--hold)}
.cluster{position:absolute;transform:translate(-50%,-50%);font:600 9.5px var(--f-mono);letter-spacing:.32em;color:rgba(198,255,52,.42);white-space:nowrap}
@keyframes blink{50%{opacity:.35}}
.hint{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:58px;z-index:5;font:500 11px var(--f-mono);color:var(--mute);letter-spacing:.06em;display:flex;gap:14px}
.hint b{color:var(--graph);font-weight:500}
.zoom{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:56px;z-index:5;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);display:grid;place-items:center;color:var(--dim);backdrop-filter:blur(10px)}
.zoom button:hover{color:var(--lime);border-color:var(--edge2)}
.zoom svg{width:16px;height:16px}
.greet{position:absolute;left:max(18px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 82px);text-align:left;z-index:4;pointer-events:none;width:min(36%,330px)}
.greet .lbl{color:var(--acid)}
.greet h1{font-size:clamp(16px,1.6vw,20px);line-height:1.4;font-weight:400;color:var(--dim);margin-top:6px}
.greet h1 b{color:var(--bone);font-weight:500}

/* hover card */
#hcard{position:absolute;z-index:20;width:290px;padding:16px 16px 14px;border-radius:16px;pointer-events:none;
  background:linear-gradient(160deg,rgba(28,34,22,.55),rgba(8,10,8,.45));border:1px solid var(--edge);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s}
#hcard.on{opacity:1;transform:none}
#hcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#hcard h3{font-size:19px}
#hcard .role{font:500 11px var(--f-mono);color:var(--acid);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
#hcard p{margin:10px 0 12px;color:var(--dim);font-size:13px;line-height:1.5}
#hcard .meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font:500 11.5px var(--f-body);background:rgba(244,246,238,.06);border:1px solid var(--edge);color:var(--dim);white-space:nowrap}
.pill b{font:600 12px var(--f-mono);color:var(--lime)}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.up{color:var(--up)}.pill.hold{color:var(--hold)}.pill.down{color:var(--down)}.pill.lime{color:var(--lime)}.pill.info{color:var(--info)}
#hcard .go{margin-top:12px;font:500 11px var(--f-mono);color:var(--graph);letter-spacing:.06em}

/* ---------- command deck ---------- */
#deck{position:relative;flex:1 1 33.333%;min-height:0;z-index:6}
#deck::before{content:"";position:absolute;left:0;right:0;top:-120px;height:120px;pointer-events:none;background:linear-gradient(180deg,rgba(4,5,4,0),rgba(4,5,4,.9) 85%,var(--void))}
.deck-in{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:4px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(18px,env(safe-area-inset-left,0px));
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px);mask-image:linear-gradient(180deg,transparent 0,#000 18px)}
.deck-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;max-width:1440px;margin:0 auto}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding-top:14px}
.stat{position:relative;padding:12px 14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);overflow:hidden;text-align:left;transition:.25s}
.stat:hover{border-color:var(--edge2);transform:translateY(-2px)}
.stat .v{font:500 24px/1.1 var(--f-disp);margin-top:6px;letter-spacing:-.02em}
.stat .v small{font:500 12px var(--f-mono);color:var(--graph);margin-left:3px;letter-spacing:0}
.stat .s{font-size:11.5px;color:var(--graph);margin-top:3px}
.stat .bar{height:3px;border-radius:3px;background:var(--c600);margin-top:9px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acid),var(--lime));border-radius:3px;box-shadow:0 0 10px var(--lime)}
.stat .spark{position:absolute;right:10px;top:12px;width:64px;height:26px;opacity:.85}
.stat .delta{color:var(--up);font:500 11px var(--f-mono)}
.panel{border-radius:var(--r);background:linear-gradient(180deg,rgba(16,19,16,.7),rgba(10,11,10,.5));border:1px solid var(--edge);padding:14px 14px 8px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-h h3{font-size:15px}
.panel-h .lbl{font-size:10px}
.seg{display:flex;gap:4px;background:var(--c850);border:1px solid var(--edge);border-radius:999px;padding:3px}
.seg button{padding:4px 10px;border-radius:999px;font-size:11.5px;color:var(--graph)}
.seg button.on{background:var(--c600);color:var(--bone)}
.work{display:flex;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid rgba(244,246,238,.05);width:100%;text-align:left;border-radius:10px}
.work:first-of-type{border-top:0}
.work:hover{background:rgba(198,255,52,.04)}
.av{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:radial-gradient(circle at 50% 30%,rgba(198,255,52,.18),rgba(198,255,52,0) 70%),var(--c800);border:1px solid var(--edge);overflow:hidden;display:grid;place-items:end center}
.av img{width:100%;height:auto;display:block;transform:translateY(8%)}
.work .t{font-weight:500;font-size:13.5px}
.work .n{font-size:12px;color:var(--graph)}
.work .r{margin-left:auto;text-align:right;flex:0 0 auto}
.prog{width:90px;height:4px;border-radius:4px;background:var(--c600);overflow:hidden;margin-top:6px;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--lime);border-radius:4px}
.prog.run i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:shim 1.4s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.feed{display:flex;gap:12px;padding:11px 6px;border-top:1px solid rgba(244,246,238,.05)}
.feed:first-of-type{border-top:0}
.feed .kind{width:3px;border-radius:3px;flex:0 0 3px;background:var(--graph)}
.feed .kind.action{background:var(--lime);box-shadow:0 0 8px var(--lime)}.feed .kind.wait{background:var(--hold)}.feed .kind.done{background:var(--up)}.feed .kind.flag{background:var(--down)}
.feed .t{font-weight:500;font-size:13.5px}
.feed .b{font-size:12.5px;color:var(--dim);margin:3px 0 7px;line-height:1.5}
.feed .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--graph)}
.mini{padding:4px 10px;border-radius:999px;border:1px solid var(--edge2);color:var(--lime);font-size:11.5px;font-weight:500;transition:.2s}
.mini:hover{background:var(--lime);color:var(--carbon)}
.mini.ghost{border-color:var(--edge);color:var(--dim)}
.mini.ghost:hover{background:var(--c600);color:var(--bone)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:radial-gradient(1200px 700px at 70% -10%,rgba(198,255,52,.07),transparent 60%),rgba(4,5,4,.86);
  backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);opacity:0;transform:scale(1.02);transition:opacity .35s,transform .35s;pointer-events:none}
.ov.on{opacity:1;transform:none;pointer-events:auto}
.ov-h{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));flex:0 0 auto}
.ov-h h2{font-size:20px}
.ov-h .sub{font-size:12.5px;color:var(--graph)}
.ov-h .sp{flex:1}
.xbtn,.bk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge);background:var(--glass);color:var(--dim);transition:.25s;flex:0 0 42px}
.xbtn:hover{color:var(--carbon);background:var(--lime);transform:rotate(90deg)}
.bk:hover{color:var(--lime);border-color:var(--edge2)}
.xbtn svg,.bk svg{width:18px;height:18px}
.ov-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(18px,env(safe-area-inset-left,0px))}
.wrap{max-width:1280px;margin:0 auto}

/* agent overlay */
.ag-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:32px;align-items:start;max-width:1280px;margin:0 auto;padding-top:8px}
.ag-hero{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.ag-stagec{position:relative;width:min(100%,420px);aspect-ratio:1/1.08;display:grid;place-items:end center}
.ag-stagec .ring{position:absolute;left:50%;bottom:4%;width:70%;aspect-ratio:3.2/1;transform:translateX(-50%);border-radius:50%;
  border:1px solid rgba(198,255,52,.5);box-shadow:0 0 30px rgba(198,255,52,.35),inset 0 0 30px rgba(198,255,52,.25);background:radial-gradient(closest-side,rgba(198,255,52,.22),transparent)}
.ag-stagec .ring.r2{width:92%;bottom:1%;border-color:rgba(198,255,52,.22);box-shadow:none;background:none;animation:ripple 3s ease-out infinite}
@keyframes ripple{0%{opacity:.9;transform:translateX(-50%) scale(.75)}100%{opacity:0;transform:translateX(-50%) scale(1.15)}}
.ag-stagec .beam{position:absolute;left:50%;bottom:9%;width:46%;height:70%;transform:translateX(-50%);background:linear-gradient(0deg,rgba(198,255,52,.16),transparent);clip-path:polygon(18% 100%,82% 100%,100% 0,0 0);filter:blur(2px)}
.ag-stagec img{position:relative;width:62%;height:auto;margin-bottom:13%;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 30px 30px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(198,255,52,.12))}
@keyframes bob{50%{transform:translateY(-12px) rotate(-1deg)}}
.ag-name{text-align:center;margin-top:8px}
.ag-name h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.03em}
.ag-name .role{font:500 12px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acid)}
.ag-name .meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ag-cta{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:500;font-size:13.5px;border:1px solid var(--edge2);color:var(--lime);transition:.2s}
.btn:hover{background:rgba(198,255,52,.1)}
.btn.pri{background:var(--lime);color:var(--carbon);border-color:transparent;box-shadow:0 0 30px rgba(198,255,52,.3)}
.btn.pri:hover{background:var(--pale)}
.btn svg{width:16px;height:16px}
.sec{margin-top:26px}
.sec:first-child{margin-top:4px}
.sec>h3{font-size:17px;display:flex;align-items:baseline;gap:10px}
.sec>h3 .lbl{font-size:10px}
.sec>p.intro{color:var(--dim);margin:6px 0 0;max-width:62ch}
.remit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.remit .c{padding:14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge)}
.remit .c h4{font-size:13px;display:flex;gap:8px;align-items:center}
.remit .c h4 i{width:8px;height:8px;border-radius:2px;background:var(--lime)}
.remit .c.esc h4 i{background:var(--hold)}
.remit .c.own h4 i{background:var(--info)}
.remit ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.remit li{font-size:12.5px;color:var(--dim);padding-left:14px;position:relative;line-height:1.45}
.remit li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--graph)}
.remit p{font-size:12.5px;color:var(--dim);margin:8px 0 0;line-height:1.5}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.sa{position:relative;text-align:left;padding:14px 14px 12px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);transition:.25s;overflow:hidden}
.sa::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--lime) 85%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.3s}
.sa:hover{transform:translateY(-3px);background:rgba(28,34,22,.7)}
.sa:hover::after{opacity:1;animation:spin 2.4s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.sa .k{font:500 10px var(--f-mono);color:var(--graph);letter-spacing:.12em}
.sa h4{font-size:14.5px;margin-top:6px}
.sa p{font-size:12.5px;color:var(--dim);margin:5px 0 10px;line-height:1.45}
.sa .go{font:500 11.5px var(--f-body);color:var(--lime);display:flex;align-items:center;gap:6px}
.sa .go svg{width:13px;height:13px;transition:.2s}
.sa:hover .go svg{transform:translateX(3px)}
.sa .st{position:absolute;top:13px;right:13px}
.handoff{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.handoff .hn{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:12.5px}
.handoff .hn img{width:24px;height:24px;object-fit:contain;object-position:top}
.handoff .arr{color:var(--mute);font-family:var(--f-mono)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px))}
.chat-col{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.chat-intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0 6px}
.chat-intro .portrait{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 70%,rgba(198,255,52,.25),transparent 65%);display:grid;place-items:end center;overflow:hidden;border:1px solid var(--edge)}
.chat-intro .portrait img{width:78%;transform:translateY(10%)}
.chat-intro h2{font-size:24px;margin-top:12px}
.chat-intro p{color:var(--graph);margin:4px 0 0;max-width:54ch;font-size:13.5px}
.msg{display:flex;gap:12px;max-width:100%}
.msg .who{width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:var(--c800);border:1px solid var(--edge);display:grid;place-items:end center;overflow:hidden}
.msg .who img{width:100%;transform:translateY(10%)}
.msg .body{min-width:0;flex:1}
.msg .nm{font:500 11.5px var(--f-mono);color:var(--acid);letter-spacing:.06em;margin-bottom:4px}
.msg .nm span{color:var(--mute)}
.msg .tx{color:var(--bone);line-height:1.62;font-size:14.5px}
.msg .tx p{margin:0 0 10px}.msg .tx p:last-child{margin:0}
.msg .tx b{color:var(--pale);font-weight:600}
.msg.me{justify-content:flex-end}
.msg.me .tx{background:var(--c700);border:1px solid var(--edge);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:min(560px,85%)}
.msg .card{margin-top:12px;padding:14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--edge);background:rgba(244,246,238,.03);font-size:13px;color:var(--dim);transition:.2s;text-align:left}
.chip:hover{border-color:var(--edge2);color:var(--lime);background:rgba(198,255,52,.06)}
.chip.sel{background:var(--lime);color:var(--carbon);border-color:transparent}
.tool{display:flex;align-items:center;gap:10px;font:500 12px var(--f-mono);color:var(--graph);padding:8px 12px;border-radius:10px;background:rgba(244,246,238,.03);border:1px dashed var(--edge);margin-top:4px;width:fit-content;max-width:100%}
.tool i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:blink 1s infinite;flex:0 0 8px}
.tool.ok i{animation:none;background:var(--up)}
.composer-row{flex:0 0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
.composer-wrap{max-width:920px;margin:0 auto;display:flex;align-items:flex-end;gap:14px}
.thinker{position:relative;width:64px;flex:0 0 64px;height:82px;display:grid;place-items:end center}
.thinker img{width:100%;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.thinker::after{content:"";position:absolute;bottom:-2px;left:50%;width:56px;height:12px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(198,255,52,.45),transparent)}
.thinker .bubble{position:absolute;top:-8px;right:-14px;display:flex;gap:3px;padding:5px 7px;border-radius:10px 10px 10px 2px;background:var(--glass2);border:1px solid var(--edge2);opacity:0;transform:scale(.6);transition:.25s}
.thinker .bubble i{width:5px;height:5px;border-radius:50%;background:var(--lime);animation:dot 1s infinite}
.thinker .bubble i:nth-child(2){animation-delay:.15s}.thinker .bubble i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-4px);opacity:1}0%,80%,100%{opacity:.4}}
.thinker.busy img{animation:think 1.1s ease-in-out infinite}
.thinker.busy .bubble{opacity:1;transform:none}
@keyframes think{25%{transform:translateY(-6px) rotate(-4deg)}75%{transform:translateY(-3px) rotate(4deg)}}
.composer{position:relative;flex:1;min-width:0;border-radius:20px;padding:1.5px;background:conic-gradient(from var(--a),rgba(198,255,52,.08) 0 20%,var(--lime) 30%,var(--pale) 34%,rgba(198,255,52,.08) 46%,rgba(127,214,255,.5) 70%,rgba(198,255,52,.08) 80%);animation:spin 5s linear infinite}
.composer::before{content:"";position:absolute;inset:-6px;border-radius:26px;background:inherit;filter:blur(14px);opacity:.35;z-index:-1}
.composer.busy{animation-duration:1.4s}
.composer.busy::before{opacity:.6}
.composer-in{border-radius:19px;background:#0b0d0a;display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 16px}
.composer textarea{flex:1;min-width:0;border:0;outline:0;background:none;resize:none;max-height:160px;font-size:15px;line-height:1.5;padding:7px 0;color:var(--bone)}
.composer textarea::placeholder{color:var(--mute)}
.cbtn{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;color:var(--graph)}
.cbtn:hover{color:var(--lime);background:rgba(198,255,52,.08)}
.cbtn.send{background:var(--lime);color:var(--carbon)}
.cbtn.send:hover{background:var(--pale);color:var(--carbon)}
.cbtn svg{width:18px;height:18px}
.c-foot{max-width:920px;margin:8px auto 0;padding-left:78px;font-size:11.5px;color:var(--mute)}
.chat-ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* in-chat widgets */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.tier{text-align:left;padding:16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);position:relative;transition:.25s}
.tier:hover{border-color:var(--edge2)}
.tier.rec{border-color:var(--lime);box-shadow:0 0 30px rgba(198,255,52,.12)}
.tier.rec::before{content:"Recommended";position:absolute;top:-10px;left:14px;font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:var(--lime);color:var(--carbon);padding:3px 8px;border-radius:6px}
.tier h4{font-size:16px}.tier .p{font:500 22px var(--f-disp);margin:8px 0 2px}.tier .p small{font:400 12px var(--f-body);color:var(--graph)}
.tier ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px;color:var(--dim)}
.tier li::before{content:"+ ";color:var(--acid);font-family:var(--f-mono)}
.kits{display:grid;gap:8px;margin-top:10px}
.kit{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:rgba(244,246,238,.03);border:1px solid var(--edge)}
.kit .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--c700);font:600 11px var(--f-mono);color:var(--lime)}
.kit .why{font-size:12px;color:var(--graph);margin-top:3px}
.kit .pr{margin-left:auto;font:500 12.5px var(--f-mono);white-space:nowrap;color:var(--pale)}
.drop{margin-top:12px;border:1.5px dashed var(--edge2);border-radius:var(--r);padding:18px;text-align:center;color:var(--dim);font-size:13px;background:rgba(198,255,52,.03)}
.files{display:grid;gap:6px;margin-top:10px}
.fl{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 10px;border-radius:10px;background:rgba(244,246,238,.03);border:1px solid var(--edge)}
.fl .ty{font:600 9.5px var(--f-mono);padding:3px 5px;border-radius:4px;background:var(--c600);color:var(--pale)}
.fl .s{margin-left:auto;color:var(--graph);font-size:11.5px}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.dim{padding:12px;border-radius:12px;background:rgba(244,246,238,.03);border:1px solid var(--edge)}
.dim .v{font:500 26px var(--f-disp)}
.dim .c{font:500 11px var(--f-mono);color:var(--graph)}
.dim .bar{height:4px;background:var(--c600);border-radius:4px;margin-top:8px;overflow:hidden}
.dim .bar i{display:block;height:100%;background:var(--lime);width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px;border-radius:12px;border:1px solid rgba(255,176,32,.35);background:rgba(255,176,32,.06);font-size:13px;color:var(--dim)}
.confirm b{color:var(--hold)}

/* ---------- venture context ---------- */
.vc-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:6px 0 10px}
.vc-hero h1{font-size:clamp(26px,3.6vw,40px);letter-spacing:-.03em}
.vc-hero p{color:var(--dim);margin:6px 0 0;max-width:60ch}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--graph)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.flow{position:relative;width:100%;border-radius:20px;background:radial-gradient(900px 400px at 50% 0%,rgba(198,255,52,.06),transparent 70%),linear-gradient(180deg,rgba(16,19,16,.6),rgba(8,10,8,.4));border:1px solid var(--edge);overflow:hidden}
.flow-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.flow svg.path{display:block}
.fnode{cursor:pointer}
.fnode .disc{transition:.25s}
.fnode:hover .disc{stroke:var(--lime);stroke-width:2}
.fnode text{font-family:var(--f-body)}
.chap{font:600 10px var(--f-mono);letter-spacing:.24em;fill:var(--acid)}
.vc-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.vcc{padding:14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge)}
.vcc .v{font:500 22px var(--f-disp);margin-top:6px}
.vcc .s{font-size:12px;color:var(--graph)}
/* stage detail */
.sd-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sd-head .por{width:86px;height:86px;border-radius:22px;background:radial-gradient(circle at 50% 75%,rgba(198,255,52,.25),transparent 70%),var(--c800);border:1px solid var(--edge);display:grid;place-items:end center;overflow:hidden;flex:0 0 86px}
.sd-head .por img{width:80%;transform:translateY(8%)}
.sd-head h1{font-size:clamp(24px,3.2vw,34px);letter-spacing:-.02em}
.sd-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:4px;margin:20px 0 16px;border-bottom:1px solid var(--edge);overflow-x:auto}
.tabs button{padding:10px 14px;font-size:13.5px;color:var(--graph);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--bone);border-color:var(--lime)}
.tabs button:hover{color:var(--bone)}
.sd-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.box{padding:16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge);min-width:0}
.box h4{font-size:14px;margin-bottom:8px}
.box p{color:var(--dim);margin:0 0 8px;font-size:13.5px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{padding:12px;border-radius:12px;background:rgba(244,246,238,.03);border:1px solid var(--edge)}
.kpi .v{font:500 20px var(--f-disp)}
.kpi .l{font-size:11.5px;color:var(--graph);margin-top:2px}
.diag{width:100%;height:auto;display:block}
.diag text{font-family:var(--f-body);fill:var(--dim)}
.rows{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:rgba(244,246,238,.03);border:1px solid var(--edge)}
.row .ic{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;font:600 10px var(--f-mono);background:var(--c700);color:var(--pale)}
.row .t{font-size:13.5px;font-weight:500}
.row .d{font-size:12.5px;color:var(--graph);margin-top:2px;line-height:1.5}
.row .r{margin-left:auto;flex:0 0 auto}
.sev{width:4px;align-self:stretch;border-radius:4px;flex:0 0 4px}
.sev.hi{background:var(--down)}.sev.md{background:var(--hold)}.sev.lo{background:var(--info)}
.tl{position:relative;padding-left:22px;display:grid;gap:14px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:linear-gradient(var(--lime),transparent)}
.tl .e{position:relative}
.tl .e::before{content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--carbon);border:2px solid var(--lime)}
.tl .e .w{font:500 11px var(--f-mono);color:var(--graph)}
.tl .e .t{font-size:13.5px;margin-top:2px}

/* ---------- pipeline ---------- */
.pp-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;margin:4px 0 16px}
.raise{position:relative;width:170px;height:170px}
.raise svg{width:100%;height:100%;transform:rotate(-90deg)}
.raise .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.raise .c b{font:500 20px var(--f-disp);display:block}
.raise .c span{font-size:11.5px;color:var(--graph)}
.pp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.track{position:relative;border-radius:20px;border:1px solid var(--edge);background:linear-gradient(180deg,rgba(16,19,16,.6),rgba(6,7,6,.5));overflow:hidden}
.track-in{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));min-width:1040px;position:relative}
.track-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.lane{position:relative;padding:16px 10px 14px;border-left:1px solid rgba(244,246,238,.05);min-height:420px}
.lane:first-child{border-left:0}
.lane-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
.lane-h h4{font-size:13.5px}
.lane-h .n{font:500 11px var(--f-mono);color:var(--graph)}
.portal{height:3px;border-radius:3px;margin:0 4px 14px;background:linear-gradient(90deg,transparent,var(--lc),transparent);box-shadow:0 0 12px var(--lc);position:relative;overflow:hidden}
.portal::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff,transparent);animation:shim 2.4s infinite}
.inv{position:relative;display:block;width:100%;text-align:left;padding:12px;border-radius:14px;margin-bottom:10px;background:rgba(14,17,13,.75);border:1px solid var(--edge);transition:.25s;animation:rise .5s both}
.inv:hover{border-color:var(--lc);box-shadow:0 0 0 1px var(--lc),0 10px 30px rgba(0,0,0,.4);transform:translateY(-2px)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.inv .orb{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;font:600 10px var(--f-mono);color:var(--carbon);background:radial-gradient(circle at 35% 30%,#fff,var(--lc) 45%,rgba(0,0,0,.4));box-shadow:0 0 14px var(--lc)}
.inv .h{display:flex;gap:10px;align-items:center}
.inv .nm{font-weight:500;font-size:13px;line-height:1.25}
.inv .f{font-size:11.5px;color:var(--graph)}
.inv .am{font:500 13px var(--f-mono);margin-top:9px;color:var(--pale)}
.inv .nx{font-size:11.5px;color:var(--dim);margin-top:4px}
.inv .flag{display:inline-flex;margin-top:8px;padding:2px 8px;font-size:10.5px}
.terminal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.term{padding:14px;border-radius:var(--r);background:var(--glass);border:1px solid var(--edge)}
.term h4{font-size:13.5px;display:flex;align-items:center;gap:8px}
.term h4 i{width:8px;height:8px;border-radius:50%}
.term .it{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 0;border-top:1px solid rgba(244,246,238,.05);color:var(--dim)}
.term .it:first-of-type{border-top:0}
.term .it span:last-child{color:var(--graph);text-align:right}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:70;background:rgba(10,12,9,.94);border-left:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 12px 18px}
.drawer .db{flex:1;overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px}
.states{display:flex;gap:4px;margin:14px 0}
.states i{flex:1;height:5px;border-radius:5px;background:var(--c600)}
.states i.on{background:var(--lc);box-shadow:0 0 8px var(--lc)}
.notes{display:grid;gap:8px;margin-top:10px}
.notes div{font-size:13px;color:var(--dim);padding:10px 12px;border-radius:10px;background:rgba(244,246,238,.03);border-left:2px solid var(--acid)}

/* ---------- knowledge vault ---------- */
.kb-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.vault{position:relative;border-radius:20px;border:1px solid var(--edge);background:radial-gradient(500px 300px at 50% 50%,rgba(198,255,52,.07),transparent 70%),rgba(8,10,8,.5);overflow:hidden;aspect-ratio:1.25/1}
.vault canvas{position:absolute;inset:0;width:100%;height:100%}
.vault .vlab{position:absolute;font:600 10px var(--f-mono);letter-spacing:.14em;color:var(--pale);text-transform:uppercase;transform:translate(-50%,-50%);pointer-events:none;text-align:center;text-shadow:0 0 8px #000}
.vault .vlab small{display:block;color:var(--graph);letter-spacing:.04em;text-transform:none;font:500 10.5px var(--f-body)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kfile{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(244,246,238,.025);margin-bottom:8px}
.kfile .ty{font:600 9.5px var(--f-mono);padding:4px 6px;border-radius:5px;background:var(--c600);color:var(--pale);flex:0 0 auto}
.kfile .nm{font-size:13px;font-weight:500;line-height:1.3}
.kfile .s{font-size:11.5px;color:var(--graph)}
.kfile .who{margin-left:auto;display:flex;flex:0 0 auto}
.kfile .who img{width:26px;height:26px;object-fit:cover;object-position:top;border-radius:50%;background:var(--c800);border:1px solid var(--edge);margin-left:-6px}
.kfile .who .none{font-size:11px;color:var(--hold)}
.kfile.warn{border-color:rgba(255,176,32,.3)}

/* ---------- connectors ---------- */
.cx-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.hub{position:relative;border-radius:20px;border:1px solid var(--edge);background:rgba(8,10,8,.5);aspect-ratio:1/1;overflow:hidden}
.hub canvas{position:absolute;inset:0;width:100%;height:100%}
.hub .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle,rgba(198,255,52,.22),rgba(10,11,10,.9) 70%);border:1px solid var(--edge2);box-shadow:0 0 40px rgba(198,255,52,.2)}
.hub .core b{font:500 15px var(--f-disp);display:block}.hub .core span{font-size:10.5px;color:var(--graph)}
.hub .port{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--c800);border:1px solid var(--edge);color:var(--graph);transition:.25s}
.hub .port.on{color:var(--carbon);background:var(--lime);box-shadow:0 0 24px rgba(198,255,52,.45);border-color:transparent}
.hub .port:hover{transform:translate(-50%,-50%) scale(1.08)}
.hub .port .pl{position:absolute;top:58px;font:500 10.5px var(--f-body);color:var(--dim);white-space:nowrap}
.cat{margin-bottom:16px}
.cat>.lbl{margin-bottom:8px;display:block}
.cx{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(244,246,238,.025);margin-bottom:8px}
.cx .ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;font:600 11px var(--f-mono);background:var(--c700);color:var(--graph)}
.cx.on .ic{background:var(--lime);color:var(--carbon)}
.cx .nm{font-weight:500;font-size:13.5px}.cx .d{font-size:12px;color:var(--graph);line-height:1.4}
.cx .r{margin-left:auto;flex:0 0 auto;text-align:right}
.feeds{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.feeds span{font:500 10px var(--f-mono);padding:2px 6px;border-radius:4px;background:rgba(198,255,52,.08);color:var(--acid)}

/* ---------- profile ---------- */
.pf-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
.idcard{perspective:1200px;cursor:pointer}
.idcard .in{position:relative;aspect-ratio:1.58/1;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.idcard.flip .in{transform:rotateY(180deg)}
.idface{position:absolute;inset:0;border-radius:22px;padding:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  background:linear-gradient(135deg,rgba(198,255,52,.16),rgba(127,214,255,.06) 40%,rgba(10,11,10,.85) 70%),var(--c850);border:1px solid var(--edge2);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.idface::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.09) 45%,transparent 60%);animation:sheen 5s infinite}
@keyframes sheen{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.idface.back{transform:rotateY(180deg)}
.idface .row1{display:flex;justify-content:space-between;align-items:flex-start}
.idface .ph{width:74px;height:74px;border-radius:18px;background:linear-gradient(135deg,var(--lime),var(--acid));color:var(--carbon);display:grid;place-items:center;font:600 24px var(--f-disp)}
.idface h2{font-size:26px;margin-top:14px}
.idface .r{font-size:12.5px;color:var(--dim)}
.idface .fields{position:absolute;left:22px;right:22px;bottom:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.idface .fields div{font-size:12.5px}.idface .fields .lbl{font-size:9px;margin-bottom:3px}
.idface .chipv{font:500 10.5px var(--f-mono);padding:4px 8px;border-radius:6px;border:1px solid var(--edge2);color:var(--lime)}
.qr{position:absolute;right:22px;bottom:20px;width:64px;height:64px;opacity:.8}
.team{display:grid;gap:8px}
.mem{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(244,246,238,.025)}
.mem .ph{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:600 12px var(--f-disp);background:var(--c600);color:var(--pale);flex:0 0 36px}
.mem .r{margin-left:auto;flex:0 0 auto}
.tog{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--edge);background:rgba(244,246,238,.025);margin-bottom:8px}
.tog .t{font-size:13.5px;font-weight:500}.tog .d{font-size:12px;color:var(--graph);line-height:1.45}
.sw{margin-left:auto;width:42px;height:24px;flex:0 0 42px;border-radius:999px;background:var(--c600);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:var(--lime)}.sw.on::after{left:21px;background:var(--carbon)}
.cap{padding:16px;border-radius:var(--r);border:1px solid var(--edge);background:var(--glass)}
.cap .bar{height:8px;border-radius:8px;background:var(--c600);overflow:hidden;margin:10px 0 6px}
.cap .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acid),var(--lime))}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);z-index:90;padding:10px 16px;border-radius:12px;background:var(--glass2);border:1px solid var(--edge2);font-size:13px;opacity:0;transition:.3s;pointer-events:none;backdrop-filter:blur(14px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--void);transition:opacity .8s}
#boot.off{opacity:0;pointer-events:none}
#boot .b{display:flex;flex-direction:column;align-items:center;gap:16px}
#boot .b svg{width:64px;height:64px;animation:pulse 1.4s ease-in-out infinite}
#boot .lbl{color:var(--acid)}
@keyframes pulse{50%{transform:scale(.9);opacity:.7}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats .stat:nth-child(n+4){display:none}
  .remit{grid-template-columns:1fr}
  .vc-cards,.pp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .deck-grid{grid-template-columns:minmax(0,1fr)}
  .ag-grid,.sd-grid,.kb-grid,.cx-grid,.pf-grid{grid-template-columns:minmax(0,1fr)}
  .ag-hero{position:relative}
  .ag-stagec{width:min(70%,300px)}
  .tiers{grid-template-columns:minmax(0,1fr)}
  .dims{grid-template-columns:repeat(2,minmax(0,1fr))}
  .terminal{grid-template-columns:minmax(0,1fr)}
  .pp-top{grid-template-columns:minmax(0,1fr);justify-items:center}
  .pp-top .pp-kpis{width:100%}
  .vsel .vtxt{display:none}
  .vsel{padding:6px}
  .vsel>svg{display:none}
  .hint{display:none}
  .greet{width:42%}
}
@media (max-width:640px){
  #top{grid-template-columns:auto 1fr auto;gap:8px}
  .logo .full{display:none}.logo .mark{display:block!important}
  .dock{justify-self:center;gap:2px;padding:4px}
  .dock button{width:36px;height:36px}
  .dock button svg{width:18px;height:18px}
  .dock button .tip{display:none}
  .avatar{width:36px;height:36px;font-size:12px}
  .vsel .vi{width:26px;height:26px}
  .greet{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .stat:nth-child(n+5){display:none}
  .stats .stat:nth-child(4){display:block}
  .tag{font-size:9.5px;padding:1px 5px}.cluster{display:none}
  .stat .v{font-size:20px}
  .stat .spark{display:none}
  .thinker{width:46px;flex-basis:46px;height:60px}
  .c-foot{padding-left:60px}
  .composer-wrap{gap:10px}
  .ov-h h2{font-size:17px}
  .zoom{bottom:40px}
  .sd-head .btn{width:100%;justify-content:center}
  .ov-h .btn{display:none}
  .idcard .in{aspect-ratio:1.05/1}
  .flow::after{content:'Swipe to follow the flow →';position:absolute;right:12px;bottom:10px;font:500 10.5px var(--f-mono);color:var(--graph)}
  .cap>div:first-child{flex-wrap:wrap;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

function spark(vals){const w=64,h=26,mx=Math.max(...vals),mn=Math.min(...vals);const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-2-(v-mn)/(mx-mn||1)*(h-6)]);
 return '<svg class="spark" viewBox="0 0 64 26"><path d="M'+pts.map(p=>p.join(',')).join(' L')+' L64,26 L0,26Z" fill="rgba(198,255,52,.12)"/><path d="M'+pts.map(p=>p.join(',')).join(' L')+'" fill="none" stroke="#C6FF34" stroke-width="1.5"/><circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="2.4" fill="#C6FF34"/></svg>';}

/* ---------- overlay stack ---------- */
const STACK=[];
function ovShell(o){
 const el=document.createElement('section');el.className='ov';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
 el.innerHTML='<header class="ov-h">'+(STACK.length?'<button class="bk" aria-label="Back">'+I.back+'</button>':'')+(o.head||'<div><h2>'+o.title+'</h2>'+(o.sub?'<div class="sub">'+o.sub+'</div>':'')+'</div>')+'<div class="sp"></div>'+(o.right||'')+'<button class="xbtn" aria-label="Close">'+I.x+'</button></header>'+(o.raw||'<div class="ov-b"><div class="wrap">'+o.body+'</div></div>');
 document.body.appendChild(el);
 $('.xbtn',el).onclick=closeAll;const bk=$('.bk',el);if(bk)bk.onclick=popOv;
 STACK.push(el);if(window.C3&&C3.pause){C3.pause(true);C3.hideCard&&C3.hideCard();}
 requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
 return el;
}
function popOv(){const el=STACK.pop();if(!el)return;el.classList.remove('on');setTimeout(()=>el.remove(),350);if(el._close)el._close();if(!STACK.length&&window.C3&&C3.pause)C3.pause(false);}
function closeAll(){while(STACK.length)popOv();closeDrawer();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.drawer.on'))closeDrawer();else popOv();}});

 Object.keys(CLUSTERS).forEach(c=>{const el=document.createElement('div');el.className='cluster';el.textContent=CLUSTERS[c];labels.appendChild(el);clabs[c]=el;});
 const CL_POS={core:[-2.55,2.15,.9],foundation:[0,-2.95,1.6],capital:[4.7,-.55,-1.5],reach:[0,3.55,-1.0]};

 // ---- controls ----
 const S={yaw:-.32,pitch:.1,dist:11.5,ty:-.32,tp:.1,td:11.5,idle:0,drag:false,moved:0,last:null,pts:new Map(),pinch:0,hover:null,paused:false,vy:0};
 const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
 function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
  const narrow=w<700;cam.fov=narrow?52:40;S.base=narrow?(w/h<.8?13.6:12.6):(w/h<1.6?12.2:11.6);S.look=narrow?.75:.55;if(!S.sized){S.dist=S.td=S.base;S.sized=1;}cam.updateProjectionMatrix();}
 new ResizeObserver(size).observe(stage);size();
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);S.pts.set(e.pointerId,[e.clientX,e.clientY]);S.drag=true;S.moved=0;S.last=[e.clientX,e.clientY];S.idle=0;cv.classList.add('drag');
  if(S.pts.size===2){const [a,b]=[...S.pts.values()];S.pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);}});
 cv.addEventListener('pointermove',e=>{
  if(S.pts.has(e.pointerId))S.pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(S.pts.size===2){const [a,b]=[...S.pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(S.pinch){S.td=clamp(S.td*S.pinch/d,6.5,18);}S.pinch=d;S.moved+=10;return;}
  if(S.drag&&S.last){const dx=e.clientX-S.last[0],dy=e.clientY-S.last[1];S.moved+=Math.abs(dx)+Math.abs(dy);S.ty+=dx*.006;S.vy=dx*.006;S.tp=clamp(S.tp+dy*.004,-.55,.65);S.last=[e.clientX,e.clientY];S.idle=0;hideCard();return;}
  if(e.pointerType==='mouse')pick(e);
 });
 const up=e=>{S.pts.delete(e.pointerId);if(S.pts.size<2)S.pinch=0;if(!S.pts.size){S.drag=false;cv.classList.remove('drag');
   if(S.moved<7&&e.type==='pointerup'){const k=hit(e);if(k)focusAgent(k);}}};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('pointerleave',()=>{if(!S.drag){hideCard();setHover(null);}});
 cv.addEventListener('wheel',e=>{e.preventDefault();S.td=clamp(S.td*(1+e.deltaY*.0011),6.5,18);S.idle=0;},{passive:false});
 function hit(e){const r=cv.getBoundingClientRect();mv.x=((e.clientX-r.left)/r.width)*2-1;mv.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mv,cam);
  const h=ray.intersectObjects(hitables,false);return h.length?h[0].object.userData.key:null;}
 function pick(e){const k=hit(e);setHover(k);if(k)showCard(k,e);else hideCard();cv.style.cursor=k?'pointer':'';}
 function setHover(k){S.hover=k;}
 C3.zoom=f=>{S.td=clamp(S.td*f,6.5,18);S.idle=0;};
 C3.reset=()=>{S.ty=-.32;S.tp=.1;S.td=S.base;S.idle=0;};
 C3.pause=v=>{S.paused=v;if(!v){clock.getDelta();loop();}};
 function focusAgent(k){const p=POS[k];if(k!=='aether'){let y=-Math.atan2(p[0],p[2]);while(y-S.ty>Math.PI)y-=2*Math.PI;while(y-S.ty<-Math.PI)y+=2*Math.PI;S.ty=y;}S.td=S.base*.72;hideCard();
  setTimeout(()=>{openAgent(k);setTimeout(()=>{S.td=S.base;},500);},520);}

 // ---- loop ----
 const clock=new THREE.Clock();let T=0;const tmp=new THREE.Vector3();
 function loop(){
  if(S.paused)return;requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);T+=dt;S.idle+=dt;
  if(!S.drag){S.ty+=S.vy;S.vy*=.92;}
  if(S.idle>4&&!S.hover){S.ty+=dt*.06;}
  S.yaw+=(S.ty-S.yaw)*.08;S.pitch+=(S.tp-S.pitch)*.08;S.dist+=(S.td-S.dist)*.08;
  root.rotation.y=S.yaw;root.rotation.x=S.pitch;
  cam.position.set(0,.4,S.dist);cam.lookAt(0,S.look||.5,0);
  shell.rotation.y=-T*.03;shell.rotation.z=Math.sin(T*.1)*.05;
  rings.forEach((r,i)=>{if(r.isMesh){r.rotation.z+=dt*(.05+i*.01);}else{const u=r.userData;const a=T*u.sp+u.ph;r.position.set(Math.cos(a)*u.r,Math.sin(a)*u.r,0);}});
  // agents
  Object.values(agents).forEach(a=>{
   const hv=S.hover===a.key?1:0;a.hover+=(hv-a.hover)*.15;
   a.sp.position.y=(a.isA?.12:.08)+Math.sin(T*1.3+a.ph)*(a.isA?.07:.05);
   const sc=1+a.hover*.12;a.sp.scale.y=a.h*sc;a.sp.scale.x=a.h*sc*(a.sp.material.map.image?a.sp.material.map.image.width/a.sp.material.map.image.height:.7);
   a.ped.rotation.z+=dt*.5;a.ped2.rotation.z-=dt*.8;
   a.ped.material.opacity=(a.isA?.85:.55)+a.hover*.4+Math.sin(T*2+a.ph)*.1;
   a.beam.material.opacity=(a.isA?.03:.04)+a.hover*.08;
   a.aura.material.opacity=(a.isA?.2+Math.sin(T*2)*.06:0)+a.hover*.35;
   if(a.isA){a.halo.rotation.z+=dt*.8;const pz=1+Math.sin(T*3)*.06;a.halo.scale.set(pz,pz,pz);a.hg.material.opacity=.38+Math.sin(T*3)*.12;a.core.material.opacity=.4+Math.sin(T*4.2)*.2;
    a.waves.forEach(w=>{w.t=(w.t+dt*.32)%1;const s=1+w.t*3.4;w.m.scale.set(s,s,s);w.m.material.opacity=(1-w.t)*.5;});}
  });
  syn.forEach(s=>{const hov=S.hover===s.k||S.hover==='aether';s.line.material.opacity=hov?.75:.26;
   s.pul.forEach(p=>{p.t=(p.t+dt*s.sp*(hov?2:1))%1;s.cu.getPoint(p.t,tmp);p.s.position.copy(tmp);const f=Math.sin(p.t*Math.PI);p.s.material.opacity=f;p.s.scale.setScalar(.25+f*.3);});});
  chainObjs.forEach(c=>{c.t=(c.t+dt*.18)%1;c.cu.getPoint(c.t,tmp);c.s.position.copy(tmp);c.s.material.opacity=Math.sin(c.t*Math.PI)*.8;});
  // neuron firing
  sparks.forEach(p=>{if(!p.e){if(Math.random()<.02){p.e=edges[(Math.random()*edges.length)|0];p.t=0;p.sp=.8+Math.random()*1.4;}else return;}
   p.t+=dt*p.sp;if(p.t>=1){p.e=null;p.s.material.opacity=0;return;}const A=nodes[p.e[0]],B=nodes[p.e[1]];p.s.position.lerpVectors(A,B,p.t);p.s.material.opacity=Math.sin(p.t*Math.PI);});
  nMat.opacity=.45+Math.sin(T*1.7)*.1;
  renderer.render(scene,cam);
  // labels
  const w=stage.clientWidth,h=stage.clientHeight;
  Object.entries(tags).forEach(([k,el])=>{const a=agents[k];tmp.set(0,-.12,0);a.g.localToWorld(tmp);tmp.project(cam);
   const vis=tmp.z<1;el.style.left=((tmp.x+1)/2*w)+'px';el.style.top=((1-tmp.y)/2*h+4)+'px';
   const wp=new THREE.Vector3();a.g.getWorldPosition(wp);const depth=clamp((wp.z+5)/10,0,1);el.style.opacity=vis?(.35+depth*.65):0;el.style.zIndex=Math.round(depth*100);});
  Object.entries(clabs).forEach(([c,el])=>{tmp.set(...CL_POS[c]);root.localToWorld(tmp);const z=tmp.z;tmp.project(cam);el.style.left=((tmp.x+1)/2*w)+'px';el.style.top=((1-tmp.y)/2*h)+'px';el.style.opacity=clamp((z+4)/8,0,1)*.9;});
  if(S.hover&&S.cardPos)placeCard();
 }
 // ---- hover card ----
 const card=document.getElementById('hcard');
 function showCard(k,e){if(S.cardKey!==k){const a=AG[k];const s=ST[a.st];
   card.innerHTML='<div class="top"><div><h3>'+a.n+'</h3><div class="role">'+a.role+'</div></div><span class="pill '+s[1]+'"><span class="d"></span>'+s[0]+'</span></div>'+
   '<p>'+a.d+'</p><div class="meta">'+(k==='aether'?'<span class="pill">Calls <b>9</b> seniors</span><span class="pill">No specialists</span>':'<span class="pill"><b>'+a.subs.length+'</b> sub-agents</span><span class="pill">'+CLUSTERS[a.cl].toLowerCase().replace(/^\w/,c=>c.toUpperCase())+'</span>')+'</div>'+
   '<div class="go">'+a.now+' · click to open</div>';S.cardKey=k;}
  S.cardPos=[e.clientX,e.clientY];placeCard();card.classList.add('on');}
 function placeCard(){const r=stage.getBoundingClientRect();let x=S.cardPos[0]-r.left+22,y=S.cardPos[1]-r.top-30;const cw=card.offsetWidth,ch=card.offsetHeight;
  if(x+cw>r.width-12)x=S.cardPos[0]-r.left-cw-22;y=clamp(y,70,r.height-ch-12);card.style.left=x+'px';card.style.top=y+'px';}
 function hideCard(){card.classList.remove('on');S.cardKey=null;S.cardPos=null;}
 C3.hideCard=hideCard;
 loop();
})();

boot();

</script>
